name: "ci"
run-name: "build & test"

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          sudo apt update
          sudo apt install gcc hlint ormolu make ghc -y
      - name: "Format check"
        run: make format-check
      - name: "Lint"
        run: make lint
      - name: "Build"
        run: make build
      - name: "Test"
        run: make test
